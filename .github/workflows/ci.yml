name: CI

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  check:
    name: 포맷 & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold clang

      - name: Python 설치 (PyO3 빌드용)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 포맷 검사
        run: cargo fmt --all -- --check

      - name: Lint 검사 (byterag-core, byterag-tests)
        run: cargo clippy -p byterag-core -p byterag-tests --no-deps -- -D warnings

  test-rust:
    name: Rust 테스트 (nextest)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Python 설치 (PyO3 테스트 빌드용)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-nextest 설치
        uses: taiki-e/install-action@nextest

      - name: Rust 캐시
        uses: Swatinem/rust-cache@v2

      - name: 유닛 & 통합 테스트 실행
        run: cargo nextest run -p byterag-core -p byterag-tests --locked

  build-bindings:
    name: 바인딩 빌드 (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        package: [byterag-ffi, byterag-csharp, byterag-node, byterag-py]
    steps:
      - uses: actions/checkout@v4

      - name: mold 링커 설치
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mold clang

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시 (바인딩용)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-bindings-${{ matrix.package }}

      - name: Python 설치 (바인딩 공통/PyO3)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js 설치
        if: matrix.package == 'byterag-node'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: .NET 설치
        if: matrix.package == 'byterag-csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 빌드 및 테스트 실행 (Node.js)
        if: matrix.package == 'byterag-node'
        run: |
          cargo build -p byterag-node --locked
          cd packages/nodejs
          npm install
          node examples/basic.js

      - name: 빌드 및 테스트 실행 (Python)
        if: matrix.package == 'byterag-py'
        run: |
          cargo build -p byterag-ffi --locked
          cd packages/python
          pip install pytest setuptools wheel
          pip install -v -e .
          python test_simple.py

      - name: 빌드 실행 (C# / .NET)
        if: matrix.package == 'byterag-csharp'
        run: |
          cargo build -p byterag-csharp --locked
          cd packages/dotnet/DBX.Dotnet
          dotnet build -c Debug

      - name: 빌드 실행 (FFI / C)
        if: matrix.package == 'byterag-ffi'
        run: cargo build -p byterag-ffi --locked
